<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Ramírez - Game Hub</title>
    <link rel="icon" type="image/png" href="assets/Cat.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body class="bg-dark text-white d-flex flex-column min-vh-100">

    <header class="py-3 border-bottom border-secondary bg-black">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <img src="assets/Cat.png" alt="Logo" width="40" class="me-3">
                <span class="fw-bold tracking-wider">GRAFICACIÓN AVANZADA</span>
            </div>
            <span class="badge bg-info text-dark">IT PACHUCA</span>
        </div>
    </header>

    <section class="py-5 text-center bg-gradient">
        <div class="container">
            <h1 class="display-3 fw-bold text-info">GAME HUB</h1>
            <p class="lead text-secondary">Portafolio de Aplicaciones Interactivas 3D</p>
        </div>
    </section>

    <main class="container my-5">
        <div class="row g-4 justify-content-center">
            <div class="col-md-5">
                <div class="card bg-black border-info h-100 shadow-lg game-card">
                    <img src="Labyrinth/assets/tapiz.webp" class="card-img-top" alt="Laberinto" style="height: 200px; object-fit: cover; opacity: 0.7;">
                    <div class="card-body text-center p-4">
                        <h4 class="card-title text-info mb-3">Laberinto de Día 3D</h4>
                        <p class="card-text text-secondary mb-4">Explora un entorno tridimensional con portales dinámicos y cámara inteligente.</p>
                        <a href="Labyrinth/index.html" class="btn btn-outline-info btn-lg w-100 fw-bold">EJECUTAR</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-3 bg-black mt-auto border-top border-secondary">
        <div class="container text-center">
            <p class="small text-secondary mb-0">David Adolfo Ramírez Vera | Ingeniería en Sistemas Computacionales</p>
        </div>
    </footer>

</body>
</html>
